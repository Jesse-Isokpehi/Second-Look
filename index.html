<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Second Look</title>
<meta name="description" content="Check a claim you saw online. The AI says what it thinks and how sure it is. The final call is yours.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="app">
  <header class="site-header">
    <div class="logo" role="img" aria-label="Second Look">
      <span aria-hidden="true">SECONDL</span>
      <svg aria-hidden="true" class="logo__glasses" width="44" height="25" viewBox="0 0 44 25" fill="none" stroke="currentColor" stroke-linecap="round">
        <ellipse cx="10.5" cy="12.5" rx="8.8" ry="10.4" stroke-width="4.4"></ellipse>
        <ellipse cx="33.5" cy="12.5" rx="8.8" ry="10.4" stroke-width="4.4"></ellipse>
        <path d="M19.4 9.6 Q22 6.8 24.6 9.6" stroke-width="2.6"></path>
        <path d="M22 12 Q20.4 17 23 17.4" stroke-width="2.2" stroke-linejoin="round"></path>
        <path d="M1.8 9 L-1.6 6.8" stroke-width="2.6"></path>
        <path d="M42.2 9 L45.6 6.8" stroke-width="2.6"></path>
      </svg>
      <span aria-hidden="true">K</span>
    </div>
    <div class="site-header__meta">
      <span class="demo-badge" id="demo-badge">Demo mode · responses simulated</span>
      <span class="claims-count">Claims checked: <strong id="claims-count">0</strong></span>
      <button type="button" class="link-button" id="end-session" data-action="end-session">End session</button>
    </div>
  </header>

  <main class="site-main" id="main" tabindex="-1"></main>

  <footer class="site-footer" id="footer"></footer>

  <div class="sr-only" id="announcer" role="status" aria-live="polite"></div>
</div>

<noscript>Second Look needs JavaScript to run.</noscript>

<script src="js/config.js"></script>
<script src="js/verdicts.js"></script>
<script src="js/reliance.js"></script>
<script src="js/app.js"></script>
</body>
</html>
